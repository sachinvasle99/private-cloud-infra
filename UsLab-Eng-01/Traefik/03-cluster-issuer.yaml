# =============================================================================
# cert-manager ClusterIssuers — Let's Encrypt, HTTP-01 solved through Traefik.
# cert-manager is already installed & healthy on this cluster.
#
# Set devops_internal@kristasoft.com before apply (used for LE expiry notices).
# Use letsencrypt-staging while testing to avoid LE rate limits, then switch
# the Ingress annotation to letsencrypt-prod for real certs.
#
#   kubectl apply -f 03-cluster-issuer.yaml
# =============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops_internal@kristasoft.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops_internal@kristasoft.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
