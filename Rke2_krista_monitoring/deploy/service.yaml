apiVersion: v1
kind: Service
metadata:
  name: rke2-deep-monitor
  namespace: rke2-monitor
  labels:
    app.kubernetes.io/name: rke2-deep-monitor
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: rke2-deep-monitor
