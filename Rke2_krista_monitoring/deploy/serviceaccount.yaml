apiVersion: v1
kind: ServiceAccount
metadata:
  name: rke2-deep-monitor
  namespace: rke2-monitor
  labels:
    app.kubernetes.io/name: rke2-deep-monitor
# The dashboard does NOT call the Kubernetes API — it only queries Prometheus
# over HTTP. No ClusterRole / RoleBinding needed.
automountServiceAccountToken: false
# Attach an imagePullSecret here if pulling from a private registry, e.g.:
# imagePullSecrets:
#   - name: ecr-pull-secret
